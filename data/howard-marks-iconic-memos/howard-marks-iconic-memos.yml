markdown: >-
  # Howard Marks’ Iconic Memos


  ## Overview


  The Howard Marks’ Iconic Memos collection comprises a complete bound set of
  memos authored by Howard Marks, co-chairman and co-founder of Oaktree Capital
  Management. The set was inscribed by Mr. Marks and donated to the Museum of
  American Finance in October 2025, coinciding with the 35th anniversary of his
  first memo mailed in 1990.


  ## Creation Process


  Marks began writing memos in 1990 to share candid commentary on the market
  environment with clients. Over three decades, he authored approximately 160
  public memos, each distributed to Oaktree clients and later made publicly
  available. The memos are known for making complex financial ideas clear and
  accessible.


  ## Context and Significance


  The memos are followed by a global audience of investors, business leaders,
  and academics. They are regarded as some of the most influential writings in
  modern finance, with praise from figures such as Warren Buffett. In 2024,
  Marks received the Museum of American Finance’s Lifetime Achievement Award for
  his contributions to the financial community.


  ## Related Publications


  - A full compendium of the memos is available as a PDF on Oaktree’s website.

  - A special curated edition, *The Best of…*, features memos deemed most
  impactful by Marks, each with a short introduction contextualizing their
  enduring relevance.


  ## Preservation


  The bound set is now part of the Museum of American Finance’s permanent
  collection, ensuring preservation and public access to these seminal works in
  financial history.
