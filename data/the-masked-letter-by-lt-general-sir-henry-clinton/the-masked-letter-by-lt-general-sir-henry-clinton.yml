name: The Masked Letter by Lt. General Sir Henry Clinton
description: A 1777 war letter using steganography, a spy technique to hide
  messages. Includes the original letter, code, and decoded text. This
  historical artifact demonstrates early cryptography in military communication.
source_url: https://www.alexanderjarvis.com/the-masked-letter-by-lt-general-sir-henry-clinton/
category: Memos
tags:
