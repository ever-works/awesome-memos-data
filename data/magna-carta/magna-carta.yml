name: Magna Carta
description: Signed in 1215 by King John of England, the Magna Carta (Great
  Charter) established the principle that everyone, including the king, is
  subject to the law. It laid the foundation for constitutional justice by
  limiting the king's power to imprison individuals without trial and
  established courts to protect rights to justice. The document influenced the
  development of habeas corpus and inspired later constitutional documents
  worldwide.
