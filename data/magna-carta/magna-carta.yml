markdown: >-
  ## Overview


  The Magna Carta, signed in 1215, is a foundational document in the history of
  democracy and legal rights.


  ## Meaning


  It established that the king was not above the law and protected certain
  rights of the king's subjects, including the right to justice and a fair
  trial.


  ## Creation Process


  The charter was agreed upon by King John and a group of rebel barons at
  Runnymede, near London, after years of conflict over the king's abuse of
  power.


  ## Context


  Created during a period of feudal monarchy in England, the Magna Carta was a
  response to King John's tyrannical rule and his excessive taxation. It
  influenced later documents such as the United States Constitution and the
  Universal Declaration of Human Rights.
