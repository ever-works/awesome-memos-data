markdown: >-
  ## Overview


  Overtime Request Memo is a formal document to seek approval for additional
  working hours.


  ## Creation Guidelines


  - Make it understandable and structured.

  - Include department, employees, and justification for overtime.


  ## Context


  Used by employees or supervisors to communicate overtime needs precisely.
  Available in PDF format (16 KB) with a download option.


  ## Pricing


  Free editable template.
