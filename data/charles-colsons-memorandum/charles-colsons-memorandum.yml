markdown: >-
  ## Overview


  Charles Colson's Memorandum is a directive sent by Charles Colson, Special
  Counsel to President Richard Nixon, to White House staff during the 1972
  reelection campaign.


  ## Content


  The memo set rules and limited time off for staff during the 24-hour,
  7-day-a-week campaign, promising to make amends for bruised feelings after the
  election.


  ## Historical Context


  Charles Colson served as special counsel to President Nixon from 1969 to 1973.
  The memorandum reflects the intense work environment during the Nixon
  reelection campaign.


  ## Significance


  The document provides insight into the internal operations and management
  style of the Nixon White House during a pivotal election year.
