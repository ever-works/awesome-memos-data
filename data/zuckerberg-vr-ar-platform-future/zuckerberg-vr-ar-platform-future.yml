name: Zuckerberg on VR/AR as the platform of the future
description: In this June 2015 memo, Mark Zuckerberg argues that virtual and
  augmented reality will be the next critical computing platform. He contends
  that Facebook must control at least two of the three core components
  (hardware, software/app, OS) to succeed, noting that in mobile Facebook only
  owned the app layer and depended on Apple and Google for hardware and OS. He
  justifies massive investment in VR/AR as necessary given the high stakes.
