markdown: >
  ## Overview


  Mark Zuckerberg's June 2015 internal memo outlines his vision for virtual
  reality (VR) and augmented reality (AR) as the next major computing platform.
  He explains why Facebook needs to invest heavily to own critical layers of the
  stack.


  ## Key Points


  - Zuckerberg identifies VR/AR as the next critical platform after mobile.

  - He argues that to succeed, a company must control at least two of three core
  components: hardware, killer application/software, and operating system.

  - In mobile, Facebook only owned the application layer (the app) and relied on
  Apple (hardware/iOS) and Google (Android) for the other layers, leaving it
  vulnerable.

  - Therefore, Facebook must invest billions to build capabilities in hardware
  and OS for VR/AR, or acquire them, to avoid dependence.

  - The high stakes of platform shifts justify the investment.


  ## Context


  The memo leaked and was published on Scribd in 2015, revealing Facebook's
  strategic rationale behind its Oculus acquisition and subsequent bets on
  AR/VR.


  ## Significance


  It demonstrates the platform thinking that guided Facebook's early VR
  investments and foreshadows its long-term commitment to the metaverse vision.
