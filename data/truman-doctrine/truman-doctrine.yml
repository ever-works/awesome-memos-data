markdown: >-
  ## Overview


  The Truman Doctrine was a policy set forth by U.S. President Harry S. Truman
  on March 12, 1947, promising economic and military aid to Greece and Turkey to
  prevent them from falling into the Soviet sphere.


  ## Significance


  - Marked the beginning of the Cold War containment strategy.

  - Established the principle of U.S. support for free peoples resisting
  subjugation.

  - Led to substantial American aid programs in Europe and beyond.


  ## Context


  Issued amid the Greek Civil War and Soviet pressure on Turkey, the doctrine
  responded to fears of communist expansion in the Eastern Mediterranean.
