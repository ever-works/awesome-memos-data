name: Truman Doctrine (1947)
description: The Truman Doctrine was a foreign policy initiative announced by
  President Harry S. Truman in 1947, pledging U.S. support for democracies
  threatened by authoritarian forces. It marked the start of the Cold War
  containment policy, providing political, military, and economic aid to Greece
  and Turkey. This document is a key milestone in United States foreign policy
  and postwar history.
