name: Steve Jobs “Top 100” agenda for a secret meeting
description: An itinerary for a top-secret meeting called the Top 100, planned
  to be held early in 2011. This memo outlines the agenda for a highly
  confidential gathering organized by Steve Jobs. It reflects strategic planning
  in Apple's leadership.
source_url: https://www.alexanderjarvis.com/memo-steve-jobs-agenda-for-a-secret-meeting/
category: Memos
tags:
  - steve-jobs
  - apple
  - strategy
markdown: >-
  ## Overview


  It was an itinerary for a top-secret meeting called the Top 100 to be held
  early the next year, in 2011.


  ## Context


  Created by Steve Jobs, this agenda highlights key discussion points for
  Apple's top executives.
