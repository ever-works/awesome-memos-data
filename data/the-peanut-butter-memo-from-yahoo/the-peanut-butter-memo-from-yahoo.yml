name: The “Peanut Butter” Memo from Yahoo!
description: Memo by Brad Garlinghouse, former SVP at Yahoo, criticizing the
  company for spreading resources too thin across too many initiatives, likened
  to peanut butter. It calls for focus and consolidation. Written during Yahoo's
  struggles in the mid-2000s.
source_url: https://www.alexanderjarvis.com/memo-the-internal-peanut-butter-memo-from-yahoo-is-still-relevant/
category: Memos
tags:
  - yahoo
  - strategy
  - internal
markdown: >-
  ## Overview


  Brad Garlinghouse, former senior vice president of Yahoo talks about spreading
  themselves too thin.


  ## Context


  Authored internally to urge strategic focus amid company-wide resource
  dilution.
