  ## Overview


  A memorandum of understanding communicates the mutually accepted expectations
  of both parties involved in a negotiation. So keeping it short and precise is
  the perfect way to make such documents.


  ## Use Cases


  - Negotiation summaries

  - Preliminary agreements


