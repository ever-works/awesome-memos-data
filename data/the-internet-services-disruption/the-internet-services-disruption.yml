name: The Internet Services Disruption
description: Memo by Microsoft CTO Ray Ozzie in 2005 urging focus on web
  services amid competition from free, ad-supported products. It warns of
  disruption in software models. This prescient document anticipated cloud
  computing shifts.
source_url: https://www.alexanderjarvis.com/the-internet-services-disruption/
category: Memos
tags:
  - microsoft
  - strategy
  - internet
markdown: >-
  ## Overview


  CTO Ray Ozzie writes a memo in 2005 that Microsoft needs to focus on web
  services in the face of competition with free, ad-supported products.


  ## Context


  Created to address emerging threats to traditional software licensing.
