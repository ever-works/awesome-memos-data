markdown: >-
  ## Overview


  In 1997, Warren Buffett had an interesting email exchange with a 39-year old
  Jeff Raikes, who was a high-level Microsoft employee. They discussed the
  competitive advantages of Coca-Cola and Microsoft.


  ## Context


  Private correspondence revealing investment philosophy.
