name: Windows 95 called and they want their mail app back
description: Email from Yahoo senior execs addressing low internal usage of
  Yahoo services (only 25% of staff), pushing for better adoption. It compares
  the outdated mail app to Windows 95. This leaked memo aimed to boost employee
  engagement with company products.
source_url: https://www.alexanderjarvis.com/windows-95-called-and-they-want-their-mail-app-back/
category: Memos
tags:
  - yahoo
  - internal
  - product
markdown: >-
  ## Overview


  Only 25% of Yahoo staff were using Yahoo and two senior execs tried to do
  something about it by sending an email. It got leaked.


  ## Context


  Internal push to increase product dogfooding within the company.
