name: Steve Yegge’s Famous Rant on Google vs Amazon
description: A rant by Google employee Steve Yegge about the Google+ platform,
  accidentally posted publicly due to forgetting to turn off public sharing.
  This internal critique compares Google's platform strategy to Amazon's,
  highlighting organizational differences. It became famous after leaking
  publicly.
source_url: https://www.alexanderjarvis.com/steve-yegges-famous-rant-on-google-vs-amazon/
category: Memos
tags:
  - google
  - rant
  - tech
markdown: >-
  ## Overview


  Steve Yegge an employee at Google goes on a rant about the Google+ platform
  and forgot to turn off the “Public” sharing option.


  ## Context


  Written as an internal post, it critiques Google's approach versus Amazon's
  platform strategy.
