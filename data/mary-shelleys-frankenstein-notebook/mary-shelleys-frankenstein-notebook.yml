markdown: >
  # Mary Shelley's Frankenstein Notebook


  ## Overview

  This collection of notebooks contains the original handwritten draft of Mary
  Shelley's novel *Frankenstein; or, The Modern Prometheus*, one of the most
  influential works of Gothic literature.


  ## Creation Process

  The story emerged during the summer of 1816, known as the 'Year Without a
  Summer,' when Mary Shelley, Percy Bysshe Shelley, Lord Byron, and John
  Polidori gathered near Lake Geneva. They exchanged ghost stories, and Shelley
  conceived the idea for Frankenstein after a waking dream. She wrote the draft
  in her notebooks over the following months.


  ## Historical Significance

  *Frankenstein* is considered the first true science fiction novel, exploring
  themes of creation, responsibility, and the dangers of unchecked scientific
  ambition. The notebooks reveal her creative process, revisions, and the
  literary influences that shaped the work.


  ## Current Location

  The notebooks are preserved and digitized in the Shelley-Godwin Archive,
  providing scholars and the public with high-quality access to the original
  manuscripts.
