name: Zynga Copycat Strategy memo
description: Memo by Zynga CEO Mark Pincus justifying their strategy of rapidly
  iterating and copying successful game mechanics from competitors. It defends
  being the best executor rather than original innovator. This candid internal
  view explains Zynga's growth in social gaming.
source_url: https://www.alexanderjarvis.com/zynga-copycat-strategy-memo/
category: Memos
tags:
  - zynga
  - strategy
  - gaming
markdown: >-
  ## Overview


  Zynga CEO Mark Pincus justifying their strategy which is in fact being the
  best, not just ripping off their competition.


  ## Context


  Written to align team on fast-follower approach in the early social gaming
  era.
