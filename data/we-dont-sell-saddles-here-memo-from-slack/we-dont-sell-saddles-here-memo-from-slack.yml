name: We Don’t Sell Saddles Here memo from Slack
description: Motivational email from Slack CEO Stewart Butterfield to staff just
  before launch, using the metaphor of selling saddles instead of horses. It
  emphasizes building end-to-end solutions. Sent to rally the team during a
  critical pre-launch phase.
source_url: https://www.alexanderjarvis.com/we-dont-sell-saddles-here-memo-from-slack/
category: Memos
tags:
  - slack
  - motivation
  - startup
markdown: >-
  ## Overview


  Slack CEO Stewart Butterfield sends a motivational email to staff just before
  launch.


  ## Context


  Internal pep talk using historical analogy to focus on integrated products.
