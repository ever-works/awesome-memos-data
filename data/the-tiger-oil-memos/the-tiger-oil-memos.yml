markdown: >-
  ## Overview


  Oil boss Edward Mike Davis is a grumpy son of a bitch in Houston in the 1970s.
  Memos were unearthed proving the point.


  ## Context


  Collection of internal memos reflecting raw executive communication in the oil
  sector.
