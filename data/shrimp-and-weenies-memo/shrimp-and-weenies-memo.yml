markdown: >
  # Shrimp and Weenies Memo


  ## Overview


  The 'Shrimp and Weenies' memo is a renowned internal company memo written by
  Mike Murray at Microsoft in the early 1990s. It was circulated company-wide to
  address rising travel expenses without resorting to strict, bureaucratic
  guidelines.


  ## Meaning


  The memo's title comes from Murray's humorous analogy: employees should travel
  as if they were paying for their own shrimp and weenies, encouraging
  cost-consciousness while treating company resources as their own. It conveyed
  a mindset of frugality and ownership rather than imposing rigid rules.


  ## Creation Process


  Mike Murray, a Microsoft manager at the time, crafted the memo after observing
  that traditional travel policy memos were ineffective. He chose a
  conversational, relatable tone, using vivid metaphors and a personal voice to
  engage employees. The memo avoided jargon and instead focused on shared values
  and practical advice.


  ## Context


  In the early 1990s, Microsoft faced rapidly increasing travel costs as the
  company expanded. Instead of issuing a standard policy memo filled with do's
  and don'ts, Murray sought to inspire behavioral change through storytelling
  and empathy, aligning with the company's culture of innovation and employee
  empowerment.


  ## Impact and Legacy


  The memo became legendary within Microsoft and beyond as an exemplar of
  effective internal communication. It demonstrated that memos could be both
  informative and engaging, influencing how companies approach policy
  announcements. Decades later, it continues to be cited in business writing and
  management training as a model of memorable, human-centered messaging.


  ## Key Takeaways


  - Use metaphors and storytelling to make policies relatable.

  - Speak as a real person, not a corporate entity.

  - Focus on underlying values rather than exhaustive rules.

  - Humor and personality can increase engagement and retention.
