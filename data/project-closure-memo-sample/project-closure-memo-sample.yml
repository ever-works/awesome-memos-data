markdown: >-
  ## Overview


  Project Closure Memo signals the official end of a project.


  ## Creation Guidelines


  - Keep it precise, factual, and short.

  - Include relevant project completion details.


  ## Context


  Essential for project managers to formally close out projects. Provided in
  Docs format (52 KB) downloadable from University of Missouri System.


  ## Pricing


  Free editable template.
