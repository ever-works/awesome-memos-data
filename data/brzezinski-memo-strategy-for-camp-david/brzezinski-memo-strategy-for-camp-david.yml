description: A five-page memo drafted by Zbigniew Brzezinski, National Security
  Advisor to President Jimmy Carter, outlining negotiation strategy for the 1978
  Camp David Accords. The memo, declassified by the CIA, provides detailed
  insights into Middle East diplomacy, leadership preparation, and tactical
  negotiation points. It is widely regarded as a masterclass in strategic
  memorandum writing.
