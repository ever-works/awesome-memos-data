name: Why Alto? by Butler Lampson at Xerox
description: Document from 1972 by Butler Lampson initiating development of the
  Xerox Alto, the first computer with a graphical user interface and mouse. It
  justifies the need for a personal workstation with innovative features like
  bitmap display and Ethernet. This memo laid the foundation for modern
  computing interfaces.
source_url: https://www.alexanderjarvis.com/why-alto/
category: Memos
tags:
  - xerox
  - historical
  - computing
featured: true
markdown: >-
  ## Overview


  Computer development for a critical computer began in 1972 with a document
  “Why Alto?” Written by Butler Lampson. This is the memo.


  ## Context


  It proposed building the Alto as a personal computer for research, influencing
  GUI and networking technologies.
