name: "Windows: The Next Killer Application on the Internet"
description: 1994 memo by J Allard at Microsoft positioning Windows for the
  internet era, later criticized as a plan for dominance. It outlines strategies
  to integrate Windows deeply with web technologies. This document shaped
  Microsoft's early internet strategy.
source_url: https://www.alexanderjarvis.com/windows-the-next-killer-application-on-the-internet/
category: Memos
tags:
  - microsoft
  - internet
  - strategy
markdown: >-
  ## Overview


  J Allard sent a memo in 1994 at Microsoft on how to position themselves for
  the internet which they were later criticised for as being a plan to take over
  the internet.


  ## Context


  Advocated for Windows as the platform for internet applications.
