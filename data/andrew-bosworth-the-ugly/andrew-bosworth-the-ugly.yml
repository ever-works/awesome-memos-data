name: Andrew Bosworth (Facebook VP) on "The Ugly"
description: In this June 2016 memo, Facebook VP Andrew Bosworth defends the
  company's growth-at-all-costs mindset, arguing that connecting people
  worldwide justifies negative side effects such as terrorists using the
  platform to coordinate attacks. He emphasizes that growth features like
  address book importing, despite being questionable, are critical to achieving
  Facebook's mission.
