name: Brevity by Winston Churchill
description: Prime Minister Winston Churchill's memo three months into WW2
  tenure, urging brevity in communications by telling people to 'get to the f’n
  point'. Written to combat verbose wartime bureaucracy, it emphasizes concise
  thinking and expression. This historical document illustrates leadership
  communication during crisis.
