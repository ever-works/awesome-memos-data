markdown: >
  # Page 1 memo.jpg


  ## Overview


  This image is a memorandum (memo) released by the United States Department of
  Justice on January 24, 2018. The memo contains a warning that the public
  release of a classified memo alleging abuses in FBI surveillance tactics would
  be 'extraordinarily reckless.'


  ## Description


  The memorandum is a scanned or photographed image of a typed document on
  official letterhead. It bears the seal of the United States Department of
  Justice and includes text that warns against releasing a classified memo
  related to FBI surveillance tactics.


  ## Context


  The memo was issued during a period of heightened political debate over the
  release of classified information regarding surveillance practices. The
  Department of Justice expressed concern that disclosing such a memo could
  compromise national security and investigative methods.


  ## Creation Process


  As a work created by an employee of the United States Department of Justice as
  part of their official duties, the image is automatically placed in the public
  domain under U.S. copyright law (17 U.S.C. §§ 101 and 105). No copyright
  protection applies to works of the U.S. federal government.


  ## Licensing


  This image is in the public domain worldwide. It may be freely used, shared,
  and modified without restriction.


