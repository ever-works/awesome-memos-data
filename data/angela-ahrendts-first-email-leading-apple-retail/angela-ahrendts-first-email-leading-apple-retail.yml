  # Angela Ahrendts’ first email leading Apple retail


  **Overview**

  This memo was Angela Ahrendts’ first communication to Apple retail employees
  after joining Apple as Senior Vice President of Retail in 2014.


  **Key Points**

  - Emphasized enriching lives and communities through Apple Stores.

  - Outlined her vision for integrating online and physical retail experiences.

  - Called for teamwork and a customer-centric culture.


  **Context**

  Sent in June 2014, the memo arrived as Ahrendts began her role overseeing
  Apple’s global retail operations. It signaled her focus on purpose-driven
  retail and set expectations for employee engagement.


  **Relevance**

  As an internal memo, it provides insight into how a senior leader communicates
  strategy directly to employees without public relations filtering, aligning
  with the definition of a memo as raw, internal communication.
