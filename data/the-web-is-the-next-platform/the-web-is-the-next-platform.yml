name: The Web is the Next Platform
description: Memo by Ben Slivka at Microsoft for Bill Gates on the future of the
  internet, which was largely ignored initially. It advocated for embracing web
  technologies early. This document foresaw the web's transformative role but
  was overlooked.
source_url: https://www.alexanderjarvis.com/the-web-is-the-next-platform/
category: Memos
tags:
  - microsoft
  - internet
  - strategy
markdown: >-
  ## Overview


  Ben Slivka at Microsoft writes a memo for Bill Gates about the future of the
  internet which was largely ignored.


  ## Context


  Prepared in the early days of the web to push Microsoft towards platform
  strategy.
