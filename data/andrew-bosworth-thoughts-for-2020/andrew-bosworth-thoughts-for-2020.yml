markdown: >
  ## Overview


  Andrew Bosworth, VP of Facebook, authored this internal memo on December 30,
  2019, addressing the company's approach to political advertising ahead of the
  2020 U.S. elections.


  ## Key Points


  - Bosworth argues that Facebook should not alter its advertising policies or
  behavior to influence election outcomes, specifically to prevent a Trump
  re-election.

  - He cites philosopher John Rawls' concept of the "veil of ignorance,"
  suggesting that fair decisions require ignoring personal stakes.

  - The memo reflects on the fallout from the 2016 election and the ongoing
  tension between platform neutrality and societal impact.


  ## Context


  The memo surfaced publicly via a New York Times article in January 2020,
  providing insight into Facebook's internal strategy debates during a period of
  intense scrutiny over election interference and misinformation.


  ## Significance


  It illustrates how tech executives grapple with ethical dilemmas around
  platform influence on democratic processes, using philosophical frameworks to
  justify policy choices.
