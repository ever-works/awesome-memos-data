name: Andrew Bosworth (Facebook VP), Thoughts for 2020
description: In this memo dated December 30, 2019, Facebook VP Andrew Bosworth
  outlines the company's stance on political advertising, arguing against
  changing ad policies to prevent a Trump re-election. He invokes philosopher
  John Rawls' "veil of ignorance" to assert that moral decisions should be made
  without bias toward any individual's outcome. The memo reflects lessons from
  the 2016 election and Facebook's internal debate over platform responsibility.
