name: Completed Staff Work from the Pentagon in WW2 shared by Thomas Watson
description: Pentagon memo during WW2 on completing staff work without annoying
  the boss, later shared by IBM's Thomas Watson. Created as military guidance on
  task completion and communication, it emphasizes self-sufficiency. Shared
  internally at IBM for management lessons.
