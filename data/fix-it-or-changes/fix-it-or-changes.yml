name: Fix it or changes
description: Neal Patterson, CEO of Cerner Corporation, sent a fiery email to
  managers urging them to motivate staff harder or face consequences. Written to
  boost performance amid perceived laziness, it backfired publicly. This memo
  illustrates aggressive leadership tactics and their risks in corporate
  communication.
