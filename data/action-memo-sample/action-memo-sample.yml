markdown: >-
  ## Overview


  An action memo is like a decision memo. It substantiates the need for removal
  of action, identifies the proposed response, and explains the rationale of the
  action removal.


  ## Use Cases


  - Action justifications

  - Response proposals


  ## Pricing


  Free editable template.
