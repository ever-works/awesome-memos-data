markdown: >-
  ## Overview


  The agreements you’ll be asked to sign before a shoot are known as deal memos
  or crew contracts. They’re usually churned up by the production company and
  serve as the contract between you and the people that hired you.


  ## Use Cases


  - Production contracts

  - Crew agreements


