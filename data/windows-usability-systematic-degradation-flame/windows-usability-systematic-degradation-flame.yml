name: Windows Usability Systematic degradation flame
description: Bill Gates' email flaming the team over the poor usability of
  installing Movie Maker, highlighting systematic degradation in Windows
  quality. It criticizes the inability to maintain high standards in a large
  codebase. This memo exemplifies executive frustration with product decline.
source_url: https://www.alexanderjarvis.com/windows-usability-systematic-degradation-flame/
category: Memos
tags:
  - microsoft
  - bill-gates
  - usability
markdown: >-
  ## Overview


  Bill Gates sends an email to ‘flame’ the appalling inability to install Movie
  Maker. It’s really funny and illustrates just how hard it is to run such a
  large software base.


  ## Context


  Written to address declining user experience in Windows products.
