name: Steve Jobs negotiating ebook pricing
description: Emails detailing how Steve Jobs convinced News Corp’s James Murdoch
  on eBook pricing. This correspondence reveals the negotiation tactics used to
  establish agency pricing for digital books. It played a pivotal role in the
  publishing industry's shift to eBooks.
source_url: https://www.alexanderjarvis.com/steve-jobs-negotiating-ebook-pricing/
category: Memos
tags:
  - steve-jobs
  - apple
  - negotiation
markdown: >-
  ## Overview


  Emails on how Steve Jobs won over News Corp’s James Murdoch on eBook pricing.


  ## Context


  These emails document the creation of the agency model for eBook sales through
  direct negotiations.
