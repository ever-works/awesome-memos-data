name: Authority Under International Law to Take Action if the Soviet Union
  Establishes Missile Bases in Cuba (August 30, 1962)
description: This memo, written by Kennedy Administration lawyers in the Office
  of Legal Counsel, analyzed the international legal implications of Soviet
  missile base construction in Cuba following U-2 spy plane photographs. It
  concluded that international law would permit the use of relatively extreme
  measures, including force, while acknowledging principles of proportionality
  and the Monroe Doctrine as a regional qualification. The memo was written six
  weeks before the Cuban Missile Crisis.
