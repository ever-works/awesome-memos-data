markdown: >-
  ## Overview


  Dated August 30, 1962, this Office of Legal Counsel memo was prepared in
  response to U-2 spy plane photographs showing surface-to-air missile sites
  under construction in Cuba. It provided legal analysis for the Kennedy
  administration regarding potential U.S. actions.


  ## Key Points


  - The memo concluded that international law would permit the United States to
  use relatively extreme measures, including various forms and degrees of force,
  in response to Soviet missile bases in Cuba.

  - It acknowledged an obligation to observe a rule of proportionality.

  - The memo discussed the Monroe Doctrine as an explicit qualification on
  general legal concepts in the Western Hemisphere, aimed at preventing European
  or Asiatic power bloc influence.

  - It examined the tension between bloc security concepts and traditional
  balance-of-power doctrines.


  ## Historical Context


  Written six weeks before the Cuban Missile Crisis, the memo reflects the
  Kennedy administration's early legal deliberations upon discovering Soviet
  missile installations in Cuba.


  ## Relevance


  The memo is notable for its early consideration of proportionality and bloc
  security concepts that informed the eventual resolution of the Cuban Missile
  Crisis.
