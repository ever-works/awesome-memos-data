markdown: >-
  ## Overview


  George Kennan's Long Telegram was a 5,300-word diplomatic cable sent from the
  U.S. Embassy in Moscow to the State Department on February 22, 1946.


  ## Content


  In the telegram, Kennan analyzed the Soviet leadership's worldview, arguing
  that it was driven by a traditional Russian sense of insecurity and a
  Marxist-Leninist ideology that viewed international relations as inherently
  conflictual. He concluded that the Soviet Union was impervious to logic of
  reason but highly sensitive to logic of force, and that it could be contained
  through firm and vigilant resistance.


  ## Historical Context


  The telegram was sent in response to U.S. inquiries about Soviet reluctance to
  cooperate on postwar plans. It provided the intellectual foundation for the
  U.S. policy of containment during the Cold War.


  ## Significance


  The Long Telegram influenced key policymakers, including Secretary of State
  James F. Byrnes, and contributed to the development of the Truman Doctrine and
  the Marshall Plan. It is considered a seminal document in Cold War history.


  ## Pricing


  Not applicable (historical document).
