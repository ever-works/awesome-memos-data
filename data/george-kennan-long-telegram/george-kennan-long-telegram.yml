name: George Kennan's Long Telegram
description: George Kennan's Long Telegram was a 5,300-word diplomatic cable
  sent from the U.S. Embassy in Moscow to the State Department on February 22,
  1946. In it, Kennan analyzed Soviet motivations and advocated for a policy of
  containment to counter Soviet expansionism during the early Cold War. The
  telegram became a foundational document shaping U.S. foreign policy for
  decades.
