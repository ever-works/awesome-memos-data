name: Apple's 8-Sentence Memo on Eliminating Typewriters (1981)
description: This historic eight-sentence memo, issued by Apple CEO Michael
  Scott in October 1981, banned the purchase or lease of typewriters at Apple
  and mandated the use of word processing technology. The memo reflects Apple's
  commitment to innovation and internal adoption of new technologies before
  promoting them to customers. It is cited as a game-changing decision that
  helped shape Apple's culture of embracing cutting-edge tools.
