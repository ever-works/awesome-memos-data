markdown: >-
  ## Overview


  Apple's 8-Sentence Memo on Eliminating Typewriters was issued in October 1981
  by then-CEO Michael Scott. The memo directed all employees to cease purchasing
  or leasing typewriters and to adopt word processing technology immediately,
  with a goal of eliminating typewriters from Apple by January 1, 1981.


  ## Memo Content


  > EFFECTIVE IMMEDIATELY!! NO MORE TYPEWRITERS ARE TO BE PURCHASED, LEASED,
  etc., etc.

  > 

  > Apple is an innovative company. We must believe and lead in all areas. If
  word processing is so neat, then let’s all use it!

  > 

  > Goal: by 1-1-81, NO typewriters at Apple… We believe the typewriter is
  obsolete. Let’s prove it inside before we try and convince our customers.


  ## Context and Impact


  At the time, typewriters were still prevalent in offices, but Apple sought to
  lead by example in adopting emerging word processing technology. The memo
  exemplified Apple's philosophy of internal innovation adoption before
  customer-facing promotion. This decision contributed to Apple's early embrace
  of personal computing tools and reinforced its culture of technological
  leadership.


  ## Relevance Today


  The memo is frequently cited in business leadership and innovation discussions
  as an example of "eating your own dog food" — using your own products
  internally to validate their effectiveness before market release.
